[project]
name = "careflow-atlas"
version = "0.1.0"
description = "Replayable healthcare ETL platform with governed agent control plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.123",
    "hypothesis>=6.170.14",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.2",
    "pyspark==3.5.3",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
pythonpath = [
    "packages/contracts/src",
    "."
]
testpaths = ["tests"]

